
<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PALAAR TV - ADVT Status</title>
<style>
:root{--gold:#f5c542;--bg:#080b12;--panel:#151e2e;--muted:#aeb8c8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:white;font-family:Arial,sans-serif}
header{background:#111827;padding:25px 5%;border-bottom:3px solid var(--gold)}
h1{color:var(--gold);margin:0;font-size:27px}
header p{color:#c5ccda;margin-bottom:0}
main{max-width:1100px;margin:25px auto;padding:0 15px}
.category{background:var(--panel);border:1px solid #34445e;border-radius:12px;padding:20px;margin-bottom:18px}
h2{color:var(--gold);font-size:21px;margin:0 0 15px}
.ad{background:#202d42;padding:15px;border-radius:8px;margin:10px 0}
.ad h3{margin:0 0 10px;color:white;font-size:19px}
.details{color:var(--muted);line-height:1.8;font-size:14px}
.active{color:#69efad;font-weight:bold}
.empty{color:var(--muted);padding:12px}
button{background:var(--gold);border:0;padding:12px 20px;border-radius:7px;font-weight:bold;cursor:pointer}
footer{text-align:center;color:#8792a4;padding:25px}
</style>
</head>
<body>
<header>
<h1>PALAAR TV – ADVT</h1>
<p>விளம்பர நிலவரம் | MEDIA SOLUTION</p>
</header>

<main>
<div id="status"></div>
<div style="text-align:center;margin:20px">
<button onclick="loadAds()">புதுப்பிக்கவும்</button>
</div>
</main>

<footer>© MEDIA SOLUTION | PALAAR TV</footer>

<script>
const categories = [
"VISUAL AD",
"SCROLLING AD",
"FLASH NEWS AD",
"S-LOGO AD",
"SPECIAL PROGRAM AD"
];

function safe(value){
return String(value || "").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",
'"':"&quot;","'":"&#39;"
}[c]));
}

function dateText(value){
return new Date(value).toLocaleString("ta-IN");
}

function loadAds(){
let ads=[];
try{
ads=JSON.parse(localStorage.getItem("palaar_tv_ads")||"[]");
}catch(e){ads=[];}

const now=new Date();
let output="";

categories.forEach(category=>{
const running=ads.filter(ad=>
ad.category===category &&
new Date(ad.startAt)<=now &&
new Date(ad.endAt)>=now
);

output+=`<section class="category">
<h2>${category}</h2>`;

if(running.length===0){
output+=`<div class="empty">தற்போது இந்த வகையில் விளம்பரம் ஓடவில்லை.</div>`;
}else{
running.forEach(ad=>{
output+=`
<div class="ad">
<h3>${safe(ad.name)}</h3>
<div class="active">● தற்போது ஒளிபரப்பில் உள்ளது</div>
<div class="details">
விளம்பர வகை: ${safe(ad.category)}<br>
தொடங்கும் தேதி: ${safe(dateText(ad.startAt))}<br>
முடியும் தேதி: ${safe(dateText(ad.endAt))}
</div>
${ad.text ? `<div class="details">விளம்பர வாசகம்: ${safe(ad.text)}</div>` : ""}
</div>`;
});
}
output+="</section>";
});

document.getElementById("status").innerHTML=output;
}

loadAds();
setInterval(loadAds,30000);
</script>
</body>
</html>
