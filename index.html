
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PALAAR TV - Live</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #080b12;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #111827;
  padding: 20px 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid #d4a52c;
}
.logo {
  font-size: 27px;
  font-weight: bold;
  color: #f5c542;
}
.live {
  color: #ff3939;
  font-weight: bold;
}
main {
  max-width: 1200px;
  margin: 35px auto;
  padding: 0 15px;
}
h1 { font-size: 28px; }
.player {
  width: 100%;
  background: #000;
  border: 1px solid #333;
  border-radius: 12px;
  overflow: hidden;
  aspect-ratio: 16 / 9;
}
iframe {
  width: 100%;
  height: 100%;
  border: 0;
}
.info {
  background: #151c29;
  margin-top: 20px;
  padding: 20px;
  border-radius: 10px;
}
footer {
  text-align: center;
  padding: 25px;
  color: #999;
}
@media(max-width:600px) {
  header { padding: 16px; }
  .logo { font-size: 21px; }
  h1 { font-size: 22px; }
  main { margin-top: 20px; }
}
.channel-list {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 25px;
  flex-wrap: wrap;
}

.channel-list button {
  width: 220px;
  height: 150px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: pointer;
}

.channel-list button img {
  width: 160px;
  height: 90px;
  object-fit: contain;
  display: block;
}</style>
</head>
<body>

<header>
  <div class="logo">
    <img src="palaartv-logo.png" alt="PALAAR TV">
    <img src="nila-tv-logo.png" alt="NILA TV">
  </div>
  <div class="live">● LIVE NOW</div>
</header>

<main>
  <h1>Watch PALAAR TV Live</h1>
  <p>Live Television Streaming</p>

  <div class="player">
    <iframe
      src="https://livetv.ipcloud.live/channels/palaartv/palaartv.php"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <div class="info">
    <h2>📺 PALAAR TV</h2>
    <p>Watch PALAAR TV Live Anytime, Anywhere.</p>
    <p class="live">● We Are Live</p>
  </div>
<div class="channel-list">

  <button onclick="changeChannel('palaartv')">
    <img src="palaartv-logo.png">
    <span>PALAAR TV</span>
  </button>

  <button onclick="changeChannel('nilatv')">
    <img src="nila-tv-logo.png">
    <span>NILA TV</span>
  </button>

</div>

<script>
function changeChannel(channel) {
  const urls = {
    palaartv: "https://livetv.ipcloud.live/channels/palaartv/palaartv.php",
    nilatv: "https://livetv.ipcloud.live/channels/palaartv/nilatv.php"
  };

  document.querySelector(".player iframe").src = urls[channel];
}
</script>
</main>

<footer>
  © 2026 PALAAR TV | All Rights Reserved
</footer>

</body>
</html>
