<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PALAAR TV – Advertisement Report</title>
<style>
:root{--navy:#092b58;--blue:#075acb;--blue2:#1648b8;--ink:#111827;--muted:#667085;--line:#d7deea;--pale:#eef3ff;--green:#19a957;--purple:#6034a5;--red:#d91f26}
*{box-sizing:border-box}body{margin:0;background:#edf2fa;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.topbar{background:linear-gradient(110deg,#062754,#124b8f);color:white;padding:16px clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;box-shadow:0 4px 15px #082b5833}
.brand{font-size:clamp(22px,3vw,32px);font-weight:900;letter-spacing:.5px}.brand span{background:#e3262e;border-radius:7px;padding:2px 7px;margin-left:4px}
.nav{display:flex;gap:9px;flex-wrap:wrap}.nav span{background:#0b3569;border:1px solid #4774a9;padding:11px 15px;border-radius:9px;font-weight:700;font-size:14px}
main{max-width:1450px;margin:24px auto;padding:0 16px 32px}.shell{background:#fff;border:1px solid #cad7ed;border-radius:18px;box-shadow:0 10px 32px #1c3e6b18;overflow:hidden}
.heading{margin:18px 20px 0;padding:16px;text-align:center;color:white;font-size:clamp(22px,3vw,32px);font-weight:900;letter-spacing:.5px;border-radius:11px;background:linear-gradient(100deg,#4269d5,#352c9d)}
.content{padding:22px clamp(15px,3vw,34px) 30px}.modebar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:0 auto 22px}.mode{border:2px solid #c7d4f3;background:#eef1ff;color:#172554;padding:13px 22px;border-radius:11px;font-weight:800;font-size:16px;cursor:pointer;min-width:min(340px,100%)}.mode.active{background:#dfe7ff;border-color:#5269d8;box-shadow:inset 0 0 0 1px #5269d8}.mode.all{background:#e7f8ec;border-color:#b7e5c4;color:#064e28}.mode.all.active{background:#c9f0d4;border-color:#1a9c50}
.categorybar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;margin-bottom:22px}.category{border:0;border-radius:9px;padding:13px 8px;background:linear-gradient(180deg,#176bd5,#0649a9);color:white;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 3px 7px #0b4d9b25}.category.active{outline:3px solid #a9c9ff;outline-offset:2px;background:linear-gradient(180deg,#0b4da9,#062e70)}.category.all{background:linear-gradient(180deg,#2abf68,#118343)}.category.all.active{outline-color:#9ee7b7}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px 22px}.field label{display:block;font-weight:800;margin:0 0 8px;font-size:15px}.req{color:#d21f2b}.field input{width:100%;height:49px;border:1px solid #aebbd0;border-radius:9px;padding:0 15px;font-size:16px;background:white;color:#111827}.field input:focus{outline:3px solid #dbeafe;border-color:#3674d8}.wide{grid-column:1/-1}.actions{display:flex;justify-content:center;margin:22px 0 6px}.view{border:0;background:linear-gradient(180deg,#1268d6,#0646a7);color:white;font-weight:900;font-size:18px;padding:15px 52px;border-radius:10px;cursor:pointer;box-shadow:0 5px 12px #0646a733}.view:hover,.download:hover{filter:brightness(1.07)}
.result{display:none;border-top:1px solid var(--line);margin-top:25px;padding-top:20px}.result h2{text-align:center;color:#302078;font-size:23px;margin:0 0 14px}.summary{background:#eef0ff;border-radius:8px;padding:12px 14px;margin-bottom:14px;line-height:1.7;font-size:14px}.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:720px}th{background:#174579;color:white;padding:12px 10px;text-align:center}td{border:1px solid #c8d0de;padding:11px 10px;text-align:center}tfoot td{background:#dcd8ff;font-weight:900}.downloadrow{text-align:center;margin-top:18px}.download{border:0;border-radius:9px;background:linear-gradient(180deg,#ef3434,#b80f17);color:#fff;font-size:17px;font-weight:900;padding:14px 35px;cursor:pointer}.note{margin-top:18px;color:#64748b;text-align:center;font-size:12px}
@media(max-width:760px){.categorybar{grid-template-columns:repeat(2,minmax(0,1fr))}.category.all{grid-column:1/-1}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.nav span{font-size:12px;padding:9px}.mode{min-width:100%}.view{width:100%;padding:14px}}
@media print{body{background:white}.topbar,.modebar,.categorybar,.formgrid,.actions,.note,.downloadrow{display:none!important}main{margin:0;padding:0}.shell{border:0;box-shadow:none}.content{padding:10px}.result{display:block!important;border:0;margin:0;padding:0}.heading{margin:0 0 15px;border-radius:0}.summary{print-color-adjust:exact;-webkit-print-color-adjust:exact}th,tfoot td{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head>
<body>
<header class="topbar"><div class="brand">PALAAR<span>TV</span></div><nav class="nav"><span>⌂ Home</span><span>♙ Admin</span><span>▣ Advertisement Management Preview</span><span>▤ Advertisement Report</span></nav></header>
<main><section class="shell"><div class="heading">ADVERTISEMENT REPORT</div><div class="content">
<div class="modebar"><button class="mode active" id="individualMode" type="button">◉ &nbsp; Individual Advertisement Report</button><button class="mode all" id="allMode" type="button">○ &nbsp; All Advertisements Report</button></div>
<div class="categorybar" id="categoryBar"><button class="category" data-type="VISUAL AD">VISUAL AD</button><button class="category" data-type="SCROLLING AD">SCROLLING AD</button><button class="category" data-type="FLASH NEWS">FLASH NEWS</button><button class="category" data-type="S-LOGO">S-LOGO</button><button class="category" data-type="SPECIAL">SPECIAL</button></div>
<div class="formgrid" id="filters"><div class="field" id="nameField"><label for="adName">ADVERTISEMENT NAME <span class="req">*</span></label><input id="adName" placeholder="Enter Advertisement Name"></div><div class="field" id="typeField"><label>SELECTED ADVERTISEMENT TYPE</label><input id="selectedType" value="Please select a category above" readonly></div><div class="field"><label for="startDate">START DATE <span class="req">*</span></label><input type="date" id="startDate"></div><div class="field"><label for="endDate">END DATE <span class="req">*</span></label><input type="date" id="endDate"></div></div>
<div class="actions"><button class="view" id="viewReport" type="button">⌕ &nbsp; VIEW REPORT</button></div>
<section class="result" id="result"><h2>REPORT PREVIEW</h2><div class="summary" id="summary"></div><div class="tablewrap"><table><thead><tr><th>S.No</th><th>Advertisement Name</th><th>Type</th><th>Total Days Played</th><th>Total Running Time</th></tr></thead><tbody id="reportRows"></tbody><tfoot id="reportFoot"></tfoot></table></div><div class="downloadrow"><button class="download" id="downloadPdf" type="button">▤ &nbsp; DOWNLOAD PDF</button></div></section>
<p class="note">DEMO PREVIEW ONLY — sample report data is shown. Playback-log / Google Drive connection will be added later.</p>
</div></section></main>
<script>
const sample=[
 {name:'Summer Offer',type:'VISUAL AD',start:'2026-10-01',end:'2026-11-30',days:61,time:'12:34:20'},
 {name:'Festival Greetings',type:'SCROLLING AD',start:'2026-10-10',end:'2026-11-15',days:37,time:'08:12:45'},
 {name:'Breaking Update',type:'FLASH NEWS',start:'2026-11-01',end:'2026-11-17',days:17,time:'03:45:10'},
 {name:'Channel Identity',type:'S-LOGO',start:'2026-10-05',end:'2026-11-30',days:57,time:'20:18:00'},
 {name:'Special Programme',type:'SPECIAL',start:'2026-11-03',end:'2026-11-17',days:15,time:'05:22:30'}
];
let mode='individual',chosenType='';const $=id=>document.getElementById(id);
function setMode(next){mode=next;const all=next==='all';$('individualMode').classList.toggle('active',!all);$('allMode').classList.toggle('active',all);$('categoryBar').style.display=all?'none':'grid';$('nameField').style.display=all?'none':'block';$('typeField').style.display=all?'none':'block';$('result').style.display='none';if(all){chosenType='';$('selectedType').value='';document.querySelectorAll('.category').forEach(b=>b.classList.remove('active'))}}
$('individualMode').onclick=()=>setMode('individual');$('allMode').onclick=()=>setMode('all');
document.querySelectorAll('.category').forEach(b=>b.onclick=()=>{chosenType=b.dataset.type;$('selectedType').value=chosenType;document.querySelectorAll('.category').forEach(x=>x.classList.toggle('active',x===b));$('result').style.display='none'});
function seconds(t){const p=t.split(':').map(Number);return p[0]*3600+p[1]*60+p[2]};function hms(s){const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return [h,m,x].map(n=>String(n).padStart(2,'0')).join(':')}
$('viewReport').onclick=()=>{const start=$('startDate').value,end=$('endDate').value,name=$('adName').value.trim();if(!start||!end){alert('Please select Start Date and End Date.');return}if(end<start){alert('End Date must be on or after Start Date.');return}if(mode==='individual'&&!chosenType){alert('Please select Advertisement Type first.');return}if(mode==='individual'&&!name){alert('Please enter Advertisement Name.');return}
let rows=sample.filter(a=>a.start<=end&&a.end>=start&&(mode==='all'||(a.type===chosenType&&a.name.toLowerCase().includes(name.toLowerCase()))));$('summary').innerHTML=`<b>Report Type:</b> ${mode==='all'?'All Advertisements':chosenType+' – '+name} &nbsp; | &nbsp; <b>Start Date:</b> ${start.split('-').reverse().join('-')} &nbsp; | &nbsp; <b>End Date:</b> ${end.split('-').reverse().join('-')}`;
$('reportRows').innerHTML=rows.length?rows.map((a,i)=>`<tr><td>${i+1}</td><td>${a.name}</td><td>${a.type}</td><td>${a.days} Days</td><td>${a.time} (HH:MM:SS)</td></tr>`).join(''):'<tr><td colspan="5">No matching sample advertisements found for this selection.</td></tr>';
const totalDays=rows.reduce((n,a)=>n+a.days,0),totalSeconds=rows.reduce((n,a)=>n+seconds(a.time),0);$('reportFoot').innerHTML=rows.length?`<tr><td colspan="3">TOTAL</td><td>${totalDays} Days</td><td>${hms(totalSeconds)}</td></tr>`:'';$('result').style.display='block';$('result').scrollIntoView({behavior:'smooth',block:'start'});
};$('downloadPdf').onclick=()=>window.print();
</script></body></html>
